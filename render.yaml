# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# This Blueprint is intentionally named to update the existing Render service.
# Values marked `sync: false` stay out of source control and are entered in
# Render's dashboard (or preserved when the service already has them).
services:
  - type: web
    name: hospital-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/openapi
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "10000"
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: DATABASE_TYPE
        value: postgresql
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_PORT
        value: "5432"
      - key: DATABASE_NAME
        value: postgres
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_URL_PARAMETERS
        value: "?sslmode=require"
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_USERNAME
        value: default
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL_ENABLED
        value: "true"
      - key: JWT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_MODEL
        value: gpt-4o-mini
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://hospital-management-2be.pages.dev
