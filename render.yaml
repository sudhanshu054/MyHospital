# Render deployment definition for the Spring Boot API.
# Deploy with: https://dashboard.render.com (New -> Blueprint -> connect repo).
# The React frontend remains on Cloudflare Pages.

services:
  - type: web
    name: hospital-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    region: singapore
    plan: free
    healthCheckPath: /api/openapi
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_TYPE
        value: postgresql
      - key: DATABASE_HOST
        sync: false
      - key: DATABASE_PORT
        value: 5432
      - key: DATABASE_NAME
        value: postgres
      - key: DATABASE_USER
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      - key: DATABASE_URL_PARAMETERS
        value: ?sslmode=require
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_HOST
        sync: false
      - key: REDIS_PORT
        value: 6379
      - key: REDIS_USERNAME
        value: default
      - key: REDIS_PASSWORD
        sync: false
      - key: REDIS_SSL_ENABLED
        value: true
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_MODEL
        value: gpt-4o-mini
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: CORS_ALLOWED_ORIGINS
        value: https://hospital-management-2be.pages.dev
