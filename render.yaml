# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
# Full-stack Render Blueprint: static frontend + Docker backend.
# Database: Supabase PostgreSQL (session pooler)
# Cache:    Upstash Redis (TLS)
#
# Deploy via Render dashboard -> New -> Blueprint -> connect this repo.
#
# Values marked `sync: false` are secrets/environment-specific and must be
# entered in the Render dashboard. They are never stored in this file.

services:
  # ── Frontend (React static site) ────────────────────────────────────────────
  - type: web
    name: hospital-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      # SPA fallback – all paths serve index.html
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Full URL of the backend API, baked into the Vite bundle at build time.
      # Update this if you rename the backend service.
      - key: VITE_API_BASE_URL
        value: https://hospital-backend.onrender.com/api
      # Google OAuth client ID – public value, safe to store in this file.
      # It is baked into the Vite bundle at build time.
      - key: VITE_GOOGLE_OAUTH_CLIENT_ID
        value: 1052735722835-gpf1rna9bnp6terj6s9oj74p0qaagk4d.apps.googleusercontent.com

  # ── Backend (Spring Boot via Docker) ────────────────────────────────────────
  - type: web
    name: hospital-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/openapi
    autoDeployTrigger: commit
    envVars:
      - key: PORT
        value: "10000"
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      # ── Database (Supabase PostgreSQL – session pooler) ───────────────────
      - key: DATABASE_TYPE
        value: postgresql
      - key: DATABASE_HOST
        sync: false          # Supabase session-pooler host, e.g. aws-0-ap-south-1.pooler.supabase.com
      - key: DATABASE_PORT
        value: "5432"
      - key: DATABASE_NAME
        value: postgres
      - key: DATABASE_USER
        sync: false          # Supabase session-pooler user, e.g. postgres.xxxxxxxxxxxxxxxxxxxx
      - key: DATABASE_PASSWORD
        sync: false          # Supabase database password
      - key: DATABASE_URL_PARAMETERS
        value: "?sslmode=require"
      # ── Redis (Upstash – TLS required) ────────────────────────────────────
      - key: REDIS_HOST
        sync: false          # Upstash endpoint, e.g. caring-xxx.upstash.io
      - key: REDIS_PORT
        value: "6379"
      - key: REDIS_USERNAME
        value: "default"
      - key: REDIS_PASSWORD
        sync: false          # Upstash Redis password
      - key: REDIS_SSL_ENABLED
        value: "true"
      # ── Auth & secrets ────────────────────────────────────────────────────
      - key: JWT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      # ── AI consultation (optional) ────────────────────────────────────────
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_API_MODEL
        value: gpt-4o-mini
      # ── CORS: allow the Render static frontend origin ─────────────────────
      # If you add a custom domain to hospital-frontend, add it here too,
      # comma-separated: https://hospital-frontend.onrender.com,https://yourdomain.com
      - key: CORS_ALLOWED_ORIGINS
        value: "https://hospital-frontend.onrender.com"
