name: Deploy Cloudflare Backend Container

on:
  push:
    branches: [main, master]
    paths:
      - backend/**
      - .github/workflows/cloudflare-backend.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_BACKEND_SECRETS: ${{ secrets.CLOUDFLARE_BACKEND_SECRETS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install Docker
        uses: docker/setup-buildx-action@v3
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate Cloudflare configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::Set CLOUDFLARE_API_TOKEN repository secret." && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::Set CLOUDFLARE_ACCOUNT_ID repository secret." && exit 1)
          test -n "$CLOUDFLARE_BACKEND_SECRETS" || (echo "::error::Set CLOUDFLARE_BACKEND_SECRETS repository secret with Supabase/Upstash/JWT values from backend/.dev.vars.example." && exit 1)
      - name: Install Worker dependencies
        working-directory: backend
        run: npm ci
      - name: Test Spring Boot application
        run: mvn -B -f backend/pom.xml test
      - name: Deploy Worker and Spring container
        working-directory: backend
        run: |
          set -o pipefail
          printf '%s' "$CLOUDFLARE_BACKEND_SECRETS" > .deploy.vars
          trap 'rm -f .deploy.vars' EXIT
          npx wrangler deploy --secrets-file .deploy.vars 2>&1 | tee deploy.log
          echo ""
          echo "Backend deployed. Set CLOUDFLARE_API_ORIGIN repository variable to:"
          grep -Eo 'https://[^ ]+\.workers\.dev' deploy.log | head -1 || true
