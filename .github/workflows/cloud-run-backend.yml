name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main, master]
    paths:
      - backend/**
      - .github/workflows/cloud-run-backend.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cloud-run-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  GCP_REGION: ${{ vars.GCP_REGION }}
  GCP_ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
  GCP_CLOUD_RUN_SERVICE: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
  GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
  GCP_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
  CLOUD_RUN_ENV_VARS: ${{ secrets.CLOUD_RUN_ENV_VARS }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate Cloud Run configuration
        shell: bash
        run: |
          for variable in \
            GCP_PROJECT_ID GCP_REGION GCP_ARTIFACT_REPOSITORY \
            GCP_CLOUD_RUN_SERVICE GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT \
            GCP_RUNTIME_SERVICE_ACCOUNT; do
            test -n "${!variable}" || (echo "::error::Set the $variable GitHub repository variable." && exit 1)
          done
          test -n "$CLOUD_RUN_ENV_VARS" || (echo "::error::Set CLOUD_RUN_ENV_VARS GitHub secret from backend/cloud-run-env.yaml.example." && exit 1)
      - name: Test Spring Boot application
        run: mvn -B -f backend/pom.xml test
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
      - name: Authenticate Docker to Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}
      - name: Build and push backend image
        id: image
        shell: bash
        run: |
          IMAGE="$GCP_REGION-docker.pkg.dev/$GCP_PROJECT_ID/$GCP_ARTIFACT_REPOSITORY/$GCP_CLOUD_RUN_SERVICE:$GITHUB_SHA"
          docker build --file backend/Dockerfile --tag "$IMAGE" backend
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Deploy to Cloud Run
        id: deploy
        shell: bash
        run: |
          printf '%s' "$CLOUD_RUN_ENV_VARS" > .cloud-run-env.yaml
          trap 'rm -f .cloud-run-env.yaml' EXIT
          gcloud run deploy "$GCP_CLOUD_RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$GCP_REGION" \
            --image "${{ steps.image.outputs.image }}" \
            --service-account "$GCP_RUNTIME_SERVICE_ACCOUNT" \
            --port 10000 \
            --memory 1Gi \
            --min-instances 0 \
            --max-instances 2 \
            --allow-unauthenticated \
            --env-vars-file .cloud-run-env.yaml \
            --quiet
          URL="$(gcloud run services describe "$GCP_CLOUD_RUN_SERVICE" --project "$GCP_PROJECT_ID" --region "$GCP_REGION" --format='value(status.url)')"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Show Pages API origin
        shell: bash
        run: |
          echo "Backend deployed: ${{ steps.deploy.outputs.url }}"
          echo "Set the CLOUD_RUN_API_ORIGIN GitHub repository variable to the URL above."
