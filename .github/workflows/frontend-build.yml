name: Frontend Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: frontend-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        env:
          # Point at the Render backend so the build validates real API paths.
          # The real value is also set in render.yaml for production builds on Render.
          VITE_API_BASE_URL: https://hospital-backend.onrender.com/api
          # Use a placeholder so the build succeeds in CI without a real client ID.
          # The real value is set as a Render environment variable for production.
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
        run: npm run build
